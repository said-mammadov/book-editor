<!doctype html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitab Oxuyucu (TXT → PDF üslubu)</title>
  <style>
    :root {
      --page-width: 210mm;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --bg: #f3f4f6;
    }
    body { margin: 0; font-family: "Georgia", "Times New Roman", serif; background: var(--bg); color: var(--text); }
    .toolbar {
      position: sticky; top: 0; z-index: 10; display: flex; gap: 12px; align-items: center;
      padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--border);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .toolbar input[type="file"] { max-width: 360px; }
    .page {
      width: min(var(--page-width), calc(100vw - 32px)); min-height: 280mm; margin: 20px auto;
      background: #fff; box-shadow: 0 8px 22px rgba(0,0,0,.08); padding: 24mm 20mm;
      box-sizing: border-box;
    }
    h1,h2,h3 { font-family: "Palatino Linotype", "Book Antiqua", Palatino, serif; margin: 1.1em 0 .5em; }
    p { line-height: 1.6; margin: .75em 0; white-space: pre-wrap; }
    .note { border-left: 4px solid #f59e0b; padding: 10px 12px; background: #fffbeb; margin: 1em 0; font-size: .95em; }
    pre {
      white-space: pre-wrap; background: #0f172a; color: #e2e8f0;
      border-radius: 8px; padding: 14px; overflow: auto; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .88rem; line-height: 1.45;
    }
    figure { margin: 1.25em 0; }
    figure img { width: 100%; max-height: 340px; object-fit: contain; background: #f9fafb; border: 1px solid var(--border); }
    figcaption { color: var(--muted); font-size: .92rem; margin-top: 8px; font-style: italic; }
    .muted { color: var(--muted); font-family: system-ui, sans-serif; font-size: .9rem; }
    @media print {
      body { background: #fff; }
      .toolbar { display: none; }
      .page { margin: 0 auto; box-shadow: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <label>TXT yüklə: <input id="txtFile" type="file" accept=".txt,text/plain" /></label>
    <span class="muted">Qeyd: <code>/picture</code> sətri şəkil placeholderıdır; şəkillər <code>./figures/figure-2-1.png</code> formatında gözlənilir.</span>
  </div>

  <main class="page" id="book"></main>

  <script>
    const book = document.getElementById('book');
    const fileInput = document.getElementById('txtFile');

    function escapeHtml(text) {
      return text
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;');
    }

    function imagePathFromCaption(caption, index) {
      const m = caption.match(/(Figure|Şəkil)\s+(\d+-\d+)/i);
      if (m) return `./figures/figure-${m[2]}.png`;
      return `./figures/figure-${index}.png`;
    }

    function renderText(raw) {
      const lines = raw.replace(/\r\n?/g, '\n').split('\n');
      const blocks = [];
      let i = 0;
      let figIndex = 1;

      while (i < lines.length) {
        const line = lines[i];
        const trimmed = line.trim();

        if (trimmed === '________________________________________________________________________________') {
          i++;
          const codeLines = [];
          while (i < lines.length && lines[i].trim() !== '________________________________________________________________________________') {
            codeLines.push(lines[i]);
            i++;
          }
          if (i < lines.length) i++;
          blocks.push({ type: 'code', text: codeLines.join('\n') });
          continue;
        }

        if (trimmed.startsWith('/picture')) {
          let caption = '';
          let j = i + 1;
          while (j < lines.length) {
            const c = lines[j].trim();
            if (c) { caption = c; break; }
            j++;
          }
          const src = imagePathFromCaption(caption, figIndex++);
          blocks.push({ type: 'figure', caption: caption || 'Şəkil', src });
          i++;
          continue;
        }

        if (!trimmed) {
          blocks.push({ type: 'blank' });
          i++;
          continue;
        }

        const headingMatch = line.match(/^(\d+\s+.+|[A-ZƏÖÜĞÇŞIİ][^\n]{0,90})$/);
        if (headingMatch && line.length < 100 && !line.includes('.') && !line.includes(':')) {
          blocks.push({ type: 'heading', text: line.trim() });
          i++;
          continue;
        }

        if (/^(WARNING|Note)\b/i.test(trimmed)) {
          blocks.push({ type: 'note', text: line.trim() });
          i++;
          continue;
        }

        blocks.push({ type: 'paragraph', text: line });
        i++;
      }

      book.innerHTML = blocks.map(block => {
        switch (block.type) {
          case 'heading':
            return `<h2>${escapeHtml(block.text)}</h2>`;
          case 'paragraph':
            return `<p>${escapeHtml(block.text)}</p>`;
          case 'code':
            return `<pre><code>${escapeHtml(block.text)}</code></pre>`;
          case 'figure':
            return `<figure><img src="${block.src}" alt="${escapeHtml(block.caption)}" onerror="this.style.display='none'; this.insertAdjacentHTML('afterend','<div class=\'note\'>Şəkil tapılmadı: ${block.src}</div>')"><figcaption>${escapeHtml(block.caption)}</figcaption></figure>`;
          case 'note':
            return `<div class="note">${escapeHtml(block.text)}</div>`;
          default:
            return '<p></p>';
        }
      }).join('\n');
    }

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const text = await file.text();
      renderText(text);
    });

    renderText('TXT faylını yükləyin və məzmun kitab formatında burada görünəcək.');
  </script>
</body>
</html>
